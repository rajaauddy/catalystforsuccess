<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Image Search</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="container">

        <h1>🖼️ My Image Search</h1>

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search image name... e.g. dog"
                autocomplete="off"
            >

            <button id="searchBtn">
                🔍 Search
            </button>

        </div>


        <div
            id="status"
            class="status"
        >
            Loading image library...
        </div>


        <div
            id="results"
            class="results"
        ></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
